<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Analisis Carta Matriks 4D (Dragon)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: center;
        }
        input {
            padding: 8px;
            font-size: 16px;
            width: 150px;
            text-align: center;
        }
        button {
            padding: 8px 15px;
            font-size: 16px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #219653;
        }
        .matrix-box {
            margin-top: 20px;
            background: #ecf0f1;
            padding: 15px;
            border-radius: 6px;
        }
        .matrix-row {
            font-family: monospace;
            font-size: 18px;
            letter-spacing: 5px;
            margin: 8px 0;
            text-align: center;
            background: #fff;
            padding: 5px;
            border-radius: 4px;
        }
        .results {
            margin-top: 20px;
            background: #e8f8f5;
            padding: 15px;
            border-radius: 6px;
            border-left: 5px solid #27ae60;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Kalkulator Carta Matriks 4D</h2>
    
    <div class="input-group">
        <label for="seedInput">Masukkan Benih (4 Digit):</label><br><br>
        <input type="text" id="seedInput" value="2746" maxlength="4">
        <button onclick="generateChart()">Jana Carta</button>
    </div>

    <div class="matrix-box">
        <h3 style="text-align: center; margin-top: 0;">Kotak 1 (Matriks Utama +3)</h3>
        <div id="kotak1Result"></div>
    </div>

    <div class="matrix-box">
        <h3 style="text-align: center; margin-top: 0;">Kotak 2 (Matriks Cermin +5)</h3>
        <div id="kotak2Result"></div>
    </div>

    <div class="results" id="extractResult">
        <!-- Titik Persamaan 2D & 3D akan dipaparkan di sini -->
    </div>
</div>

<script>
function generateChart() {
    let inputVal = document.getElementById("seedInput").value;
    
    // Pastikan input adalah 4 digit
    if (inputVal.length !== 4 || isNaN(inputVal)) {
        alert("Sila masukkan tepat 4 digit nombor benih!");
        return;
    }

    let seedRow = inputVal.split("").map(Number);
    let rows = 4;
    let cols = 4;
    
    let kotak1 = [];
    let kotak2 = [];

    // Baris 1 Kotak 1
    kotak1.push(seedRow);

    // Jana Kotak 1 (+3 Modulo 10)
    for (let i = 1; i < rows; i++) {
        let currentRow = [];
        for (let j = 0; j < cols; j++) {
            let newVal = (kotak1[i - 1][j] + 3) % 10;
            currentRow.push(newVal);
        }
        kotak1.push(currentRow);
    }

    // Jana Kotak 2 (+5 Indeks Bayangan / Cermin)
    for (let i = 0; i < rows; i++) {
        let currentMirrorRow = [];
        for (let j = 0; j < cols; j++) {
            let mirrorVal = (kotak1[i][j] + 5) % 10;
            currentMirrorRow.push(mirrorVal);
        }
        kotak2.push(currentMirrorRow);
    }

    // Paparkan Kotak 1
    let k1HTML = "";
    for (let i = 0; i < rows; i++) {
        k1HTML += `<div class="matrix-row">Baris ${i+1}: ${kotak1[i].join("  ")}</div>`;
    }
    document.getElementById("kotak1Result").innerHTML = k1HTML;

    // Paparkan Kotak 2
    let k2HTML = "";
    for (let i = 0; i < rows; i++) {
        k2HTML += `<div class="matrix-row">Baris ${i+1}: ${kotak2[i].join("  ")}</div>`;
    }
    document.getElementById("kotak2Result").innerHTML = k2HTML;

    // Paparkan Pengekstrakan Titik Persamaan 2D & 3D
    let d2_1 = "" + kotak1[0][0] + kotak1[0][1];
    let d2_2 = "" + kotak1[1][0] + kotak1[1][1];
    let d3_1 = "" + kotak1[0][0] + kotak1[0][1] + kotak1[0][2];
    let d3_2 = "" + kotak1[1][0] + kotak1[1][1] + kotak1[1][2];

    let extractHTML = `
        <h3 style="margin-top:0;">Titik Persamaan 2D & 3D Pilihan:</h3>
        <p><b>Pilihan Kepala 2D Utama :</b> ${d2_1}, ${d2_2}</p>
        <p><b>Pilihan 3D Melintang    :</b> ${d3_1}, ${d3_2}</p>
    `;
    document.getElementById("extractResult").innerHTML = extractHTML;
}

// Jalankan fungsi secara automatik semasa mula muat turun
window.onload = function() {
    generateChart();
};
</script>

</body>
</html>
